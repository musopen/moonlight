name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        # spfk-metadata declares Swift tools version 6.2, which requires
        # Xcode 26 or newer. macos-15 includes Xcode 26.3.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check Firebase configuration is not committed
        # Official releases install the real GoogleService-Info.plist from the
        # team's secret store. It must never be committed, and the committed
        # Xcode project must not reference it, so builds without it keep working.
        run: |
          if git ls-files --error-unmatch Sources/App/GoogleService-Info.plist >/dev/null 2>&1; then
            echo "::error::Sources/App/GoogleService-Info.plist must not be committed."
            exit 1
          fi
          if grep -q 'GoogleService-Info.plist' Moonlight.xcodeproj/project.pbxproj; then
            echo "::error::Moonlight.xcodeproj references GoogleService-Info.plist. Run xcodegen generate without the file before committing."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Build iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -scheme MoonlightMobile \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -destination "platform=macOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Test iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -project Moonlight.xcodeproj \
            -scheme MoonlightMobile \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
