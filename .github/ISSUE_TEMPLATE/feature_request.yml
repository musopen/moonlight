name: Feature request
description: Suggest an idea or improvement for Moonlight.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Your idea for a solution, if you have one.
  - type: dropdown
    id: platform
    attributes:
      label: Device
      multiple: true
      options:
        - Mac
        - iPhone
        - iPad
